document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\n\n\n<script src=\"f504bed7-78d7-434f-a103-d9169c43d5ca\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet><script src=\"44bf5b18-6c49-4d4d-a163-705a11e2cf06\"><\u002Fscript><script src=\"a0d6ac6e-6816-4c05-8b8a-731f63aa3f68\"><\u002Fscript><style>html{scroll-behavior:smooth}a{color:var(--accent-gold)}a:hover{color:var(--gold-300,#C9B27A)}<\u002Fstyle><\u002Fhelmet>\n<div style=\"font-family:var(--font-brand);background:var(--surface-page);color:var(--text-primary);overflow-x:hidden\">\n\n<header style=\"{{ headerStyle }}\">\n<a href=\"https://www.racreditos.pt\"><img src=\"92ba806a-9a34-4ffa-b536-f82a9cc9e042\" style=\"height:56px;width:153px\" alt=\"RA Intermediários de Crédito\"><\u002Fa>\n<button sc-camel-on-click=\"{{ goForm }}\" style=\"background:var(--maroon-700);color:var(--text-inverse);font-family:inherit;font-weight:var(--fw-bold);font-size:14px;padding:11px 22px;border-radius:var(--radius-pill);border:1px solid var(--accent-gold);cursor:pointer\" style-hover=\"background:var(--maroon-300)\">Pedir contacto<\u002Fbutton>\n<\u002Fheader>\n\n<section data-screen-label=\"01 Entrada\" style=\"position:relative;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:130px clamp(20px,5vw,64px) 64px\">\n<image-slot id=\"hero-bg\" shape=\"rect\" src=\"a3691cdf-3a94-4821-b665-f3a246245703\" placeholder=\"Foto: consultor(a) e cliente em conversa, luz quente\" style=\"position:absolute;inset:0;width:100%;height:100%\"><\u002Fimage-slot>\n<div style=\"position:absolute;inset:0;background:linear-gradient(180deg,rgba(42,21,22,0.78),rgba(42,21,22,0.9));z-index:5;pointer-events:none\"><\u002Fdiv>\n<div style=\"position:relative;z-index:6;max-width:960px;width:100%;text-align:center;color:var(--text-inverse)\">\n<div style=\"display:inline-block;font-size:12.5px;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent-gold);font-weight:var(--fw-bold);border:1px solid var(--accent-gold);padding:7px 16px;border-radius:var(--radius-pill)\">Parcerias e rede RA<\u002Fdiv>\n<h1 style=\"font-size:clamp(2.1rem,5vw,3.6rem);font-weight:var(--fw-black);line-height:1.08;margin:22px 0 16px;text-wrap:balance\">Quantos negócios já perdeste por falta de apoio no crédito?<\u002Fh1>\n<p style=\"font-size:clamp(15px,1.6vw,17.5px);line-height:1.6;font-weight:var(--fw-light);max-width:620px;margin:0 auto 34px;color:var(--text-inverse);text-wrap:pretty\">Somos especialistas em encontrar soluções de crédito adequadas ao perfil de cada cliente.<\u002Fp>\n<div style=\"font-size:14px;font-weight:var(--fw-bold);margin-bottom:14px\">Como quer trabalhar com a RA Intermediários de Crédito?<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;text-align:left\">\n<button sc-camel-on-click=\"{{ pickPartner }}\" style=\"{{ partnerCardStyle }}\" style-hover=\"background:var(--accent-gold) !important;color:var(--maroon-700) !important;border-color:var(--accent-gold) !important\">\n<span style=\"font-size:20px;font-weight:var(--fw-black);line-height:1.2\">Quero ser Parceiro de Crédito<\u002Fspan>\n<span style=\"font-size:14px;line-height:1.55;font-weight:var(--fw-light)\">Para imobiliárias e outros profissionais que procuram um parceiro de crédito para fechar mais negócios<\u002Fspan>\n<\u002Fbutton>\n<button sc-camel-on-click=\"{{ pickNetwork }}\" style=\"{{ networkCardStyle }}\" style-hover=\"background:var(--accent-gold) !important;color:var(--maroon-700) !important;border-color:var(--accent-gold) !important\">\n<span style=\"font-size:20px;font-weight:var(--fw-black);line-height:1.2\">Quero integrar a rede RA Intermediários de Crédito<\u002Fspan>\n<span style=\"font-size:14px;line-height:1.55;font-weight:var(--fw-light)\">Abrir uma agência RA ou trabalhar como gestor de crédito numa agência existente.<\u002Fspan>\n<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;justify-content:center;gap:12px 36px;margin-top:34px;font-size:14px;font-weight:var(--fw-bold)\">\n<div style=\"display:flex;align-items:center;gap:10px;line-height:1\"><span style=\"width:8px;height:8px;border-radius:50%;background:var(--accent-gold);flex:0 0 8px\"><\u002Fspan><span><span style=\"color:var(--accent-gold)\">15+<\u002Fspan> anos de experiência<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:10px;line-height:1\"><span style=\"width:8px;height:8px;border-radius:50%;background:var(--accent-gold);flex:0 0 8px\"><\u002Fspan><span>De norte a sul do país<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:10px;line-height:1\"><span style=\"width:8px;height:8px;border-radius:50%;background:var(--accent-gold);flex:0 0 8px\"><\u002Fspan><span>Vários bancos parceiros<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"02 História\" style=\"padding:var(--space-9) clamp(20px,5vw,64px)\">\n<div style=\"max-width:1000px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:48px;align-items:center\">\n<div style=\"position:relative\">\n<image-slot id=\"ceo-photo\" src=\"7ee56783-e8b3-4246-8d15-bfb8d72c6ca1\" shape=\"rect\" placeholder=\"Foto profissional de Raquel Silva\" style=\"width:100%;aspect-ratio:4/5;border-radius:var(--radius-lg)\"><\u002Fimage-slot>\n<div style=\"position:absolute;left:-12px;bottom:28px;background:var(--maroon-700);color:var(--text-inverse);padding:16px 22px;border-radius:var(--radius-md);box-shadow:var(--shadow-md);z-index:3\">\n<div style=\"font-size:34px;font-weight:var(--fw-black);color:var(--accent-gold);line-height:1\">15+<\u002Fdiv>\n<div style=\"font-size:12px;letter-spacing:0.06em;text-transform:uppercase;font-weight:var(--fw-bold);margin-top:4px\">Anos de experiência<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div style=\"font-size:13px;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent-gold);font-weight:var(--fw-bold);margin-bottom:12px\">A nossa história<\u002Fdiv>\n<h2 style=\"font-size:clamp(1.8rem,3.4vw,2.6rem);font-weight:var(--fw-black);line-height:1.12;margin:0 0 20px;color:var(--accent-maroon)\">Acreditamos nos seus sonhos!<\u002Fh2>\n<p style=\"font-size:15.5px;line-height:1.7;color:var(--text-secondary);font-weight:var(--fw-light);margin:0 0 14px\">A RA Intermediários de Crédito reúne profissionais experientes que acompanham cada processo de crédito com rigor técnico e articulação com instituições financeiras parceiras.<\u002Fp>\n<p style=\"font-size:15.5px;line-height:1.7;color:var(--text-secondary);font-weight:var(--fw-light);margin:0 0 14px\">Com mais de 15 anos de experiência no setor financeiro, Raquel Silva é a fundadora da RA Intermediários de Crédito. A sua formação em Psicologia alia-se ao rigor técnico exigido pela intermediação de crédito.<\u002Fp>\n<p style=\"font-size:15.5px;line-height:1.7;color:var(--text-secondary);font-weight:var(--fw-light);margin:0 0 26px\">Acredita que decisões financeiras informadas transformam a vida das pessoas.<\u002Fp>\n<div style=\"display:flex;align-items:center;gap:14px;margin-bottom:28px\">\n<div style=\"width:36px;height:2px;background:var(--accent-gold)\"><\u002Fdiv>\n<div><div style=\"font-size:15px;font-weight:var(--fw-black);color:var(--accent-maroon)\">Raquel Silva<\u002Fdiv><div style=\"font-size:12px;font-weight:var(--fw-bold);color:#B98A8F;letter-spacing:0.04em;text-transform:uppercase\">CEO RA Intermediários de Crédito<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<button sc-camel-on-click=\"{{ goForm }}\" style=\"background:var(--accent-gold);color:var(--maroon-500);font-family:inherit;font-weight:var(--fw-bold);font-size:15px;padding:13px 28px;border-radius:var(--radius-pill);border:none;cursor:pointer\" style-hover=\"filter:brightness(1.08)\">Quero saber mais<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"03 Serviço RA\" style=\"background:var(--maroon-700);color:var(--text-inverse);padding:var(--space-9) clamp(20px,5vw,64px)\">\n<div style=\"max-width:1080px;margin:0 auto\">\n<div style=\"max-width:720px;margin:0 auto 48px;text-align:center\">\n<div style=\"font-size:13px;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent-gold);font-weight:var(--fw-bold);margin-bottom:12px\">O que pode contar connosco<\u002Fdiv>\n<h2 style=\"font-size:clamp(1.7rem,3.2vw,2.4rem);font-weight:var(--fw-black);line-height:1.15;margin:0 0 18px;text-wrap:balance\">Porque deve escolher a RA Intermediários de Crédito como intermediário de crédito?<\u002Fh2>\n<p style=\"font-size:16px;line-height:1.65;font-weight:var(--fw-light);margin:0;color:var(--text-inverse)\">Apoiamos na procura das condições de crédito ajustadas ao perfil de cada cliente, junto dos nossos parceiros bancários.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:18px\">\n<sc-for list=\"{{ pillars }}\" as=\"p\" hint-placeholder-count=\"4\">\n<div style=\"border:1px solid var(--border-on-dark);border-radius:var(--radius-lg);padding:28px 24px;display:flex;flex-direction:column;gap:12px\">\n<div style=\"font-size:13px;font-weight:var(--fw-black);color:var(--accent-gold)\">{{ p.num }}<\u002Fdiv>\n<div style=\"font-size:19px;font-weight:var(--fw-black)\">{{ p.title }}<\u002Fdiv>\n<div style=\"font-size:14.5px;line-height:1.6;font-weight:var(--fw-light);color:var(--text-inverse)\">{{ p.desc }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"margin-top:44px;padding-top:36px;border-top:1px solid var(--border-on-dark);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px\">\n<p style=\"font-size:17px;font-weight:var(--fw-bold);margin:0;max-width:560px;line-height:1.45\">Estamos presentes de norte a sul do país, prontos para o ajudar em qualquer região.<\u002Fp>\n<button sc-camel-on-click=\"{{ goForm }}\" style=\"background:var(--accent-gold);color:var(--maroon-500);font-family:inherit;font-weight:var(--fw-bold);font-size:15px;padding:13px 28px;border-radius:var(--radius-pill);border:none;cursor:pointer\" style-hover=\"filter:brightness(1.08)\">Pedir mais informações<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"04 Testemunhos\" style=\"background:var(--cream-300);padding:var(--space-9) clamp(20px,5vw,64px)\">\n<div style=\"max-width:1080px;margin:0 auto\">\n<div style=\"text-align:center;margin-bottom:40px\">\n<div style=\"font-size:13px;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent-maroon);font-weight:var(--fw-bold);margin-bottom:12px\">Testemunhos<\u002Fdiv>\n<h2 style=\"font-size:clamp(1.7rem,3.2vw,2.4rem);font-weight:var(--fw-black);line-height:1.15;margin:0;color:var(--accent-maroon)\">Quem já trabalha connosco<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:20px\">\n<sc-for list=\"{{ testimonials }}\" as=\"t\" hint-placeholder-count=\"3\">\n<div style=\"background:var(--surface-card);border-radius:var(--radius-lg);padding:28px;display:flex;flex-direction:column;gap:20px;box-shadow:var(--shadow-sm)\">\n<div style=\"font-size:44px;line-height:0.6;color:var(--accent-gold);font-weight:var(--fw-black);height:20px\">“<\u002Fdiv>\n<p style=\"font-size:15px;line-height:1.65;color:var(--text-secondary);font-weight:var(--fw-light);margin:0;flex:1;white-space:pre-line\">{{ t.quote }}<\u002Fp>\n<div style=\"display:flex;align-items:center;gap:14px\">\n<image-slot id=\"{{ t.slotId }}\" src=\"{{ t.src }}\" shape=\"circle\" placeholder=\"Foto\" style=\"width:52px;height:52px;flex:0 0 52px\"><\u002Fimage-slot>\n<div>\n<div style=\"font-size:15px;font-weight:var(--fw-black);color:var(--accent-maroon)\">{{ t.name }}<\u002Fdiv>\n<div style=\"font-size:12.5px;font-weight:var(--fw-bold);color:#B98A8F;text-transform:uppercase;letter-spacing:0.04em\">{{ t.role }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"formulario\" ref=\"{{ formRef }}\" data-screen-label=\"05 Formulário\" style=\"padding:var(--space-9) clamp(20px,5vw,64px);scroll-margin-top:90px\">\n<div style=\"max-width:620px;margin:0 auto\">\n<div style=\"text-align:center;margin-bottom:32px\">\n<h2 style=\"font-size:clamp(1.7rem,3.2vw,2.4rem);font-weight:var(--fw-black);line-height:1.15;margin:0 0 12px;color:var(--accent-maroon)\">Fale connosco<\u002Fh2>\n<p style=\"font-size:15.5px;line-height:1.6;color:var(--text-secondary);font-weight:var(--fw-light);margin:0\">Deixe os seus dados e entramos em contacto consigo.<\u002Fp>\n<\u002Fdiv>\n<sc-if value=\"{{ submitted }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"06 Boas-vindas\" style=\"background:var(--maroon-700);color:var(--text-inverse);border-radius:var(--radius-lg);overflow:hidden\">\n<div style=\"padding:clamp(32px,5vw,48px) clamp(22px,5vw,40px) 32px;text-align:center\">\n<div style=\"width:56px;height:56px;border-radius:50%;background:var(--accent-gold);color:var(--maroon-700);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:26px;font-weight:var(--fw-black)\">✓<\u002Fdiv>\n<div style=\"font-size:12.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent-gold);font-weight:var(--fw-bold);margin-bottom:10px\">{{ welcomeTag }}<\u002Fdiv>\n<div style=\"font-size:clamp(1.6rem,3.6vw,2.2rem);font-weight:var(--fw-black);line-height:1.15;margin-bottom:12px\">Obrigado, {{ firstName }}!<\u002Fdiv>\n<p style=\"font-size:15.5px;line-height:1.6;font-weight:var(--fw-light);margin:0 auto;max-width:440px\">Recebemos o seu pedido. Vamos contactá-lo nas próximas 24–48h úteis.<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding:0 clamp(22px,5vw,40px) 32px\">\n<div style=\"font-size:13px;font-weight:var(--fw-bold);color:var(--accent-gold);margin-bottom:14px;text-align:center\">Próximos passos<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<sc-for list=\"{{ nextSteps }}\" as=\"st\" hint-placeholder-count=\"3\">\n<div style=\"display:flex;align-items:center;gap:14px;border:1px solid var(--border-on-dark);border-radius:var(--radius-md);padding:14px 16px\">\n<div style=\"width:30px;height:30px;flex:0 0 30px;border-radius:50%;border:1.5px solid var(--accent-gold);color:var(--accent-gold);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:var(--fw-black)\">{{ st.n }}<\u002Fdiv>\n<div style=\"font-size:15px;font-weight:var(--fw-bold);line-height:1.35\">{{ st.label }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:var(--cream-300);color:var(--text-primary);padding:28px clamp(22px,5vw,40px);display:flex;align-items:center;gap:18px;flex-wrap:wrap\">\n<image-slot id=\"ceo-photo\" src=\"7ee56783-e8b3-4246-8d15-bfb8d72c6ca1\" shape=\"circle\" placeholder=\"Raquel\" style=\"width:72px;height:72px;flex:0 0 72px\"><\u002Fimage-slot>\n<div style=\"flex:1;min-width:220px\">\n<p style=\"font-size:15px;line-height:1.6;font-weight:var(--fw-light);margin:0 0 10px;color:var(--text-secondary)\">“Seja bem-vindo(a). Será um gosto conhecê-lo(a) e mostrar-lhe como trabalhamos.”<\u002Fp>\n<div style=\"font-size:14px;font-weight:var(--fw-black);color:var(--accent-maroon)\">Raquel Silva <span style=\"font-weight:var(--fw-bold);color:#B98A8F;font-size:12px;letter-spacing:0.04em;text-transform:uppercase;margin-left:6px\">CEO RA Intermediários de Crédito<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:26px clamp(22px,5vw,40px);display:flex;flex-wrap:wrap;gap:12px;justify-content:center\">\n<a href=\"https://www.racreditos.pt\" target=\"_blank\" rel=\"noopener\" style=\"background:var(--accent-gold);color:var(--maroon-700);text-decoration:none;font-weight:var(--fw-bold);font-size:15px;padding:13px 26px;border-radius:var(--radius-pill);min-height:48px;box-sizing:border-box;display:flex;align-items:center\" style-hover=\"filter:brightness(1.08)\">Conhecer a RA Intermediários de Crédito<\u002Fa>\n<a href=\"tel:+351252021731\" style=\"border:1px solid var(--accent-gold);color:var(--text-inverse);text-decoration:none;font-weight:var(--fw-bold);font-size:15px;padding:13px 26px;border-radius:var(--radius-pill);min-height:48px;box-sizing:border-box;display:flex;align-items:center\" style-hover=\"background:rgba(171,145,80,0.2)\">Ligar 252 021 731<\u002Fa>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 24px 26px\">\n<div style=\"font-size:14px;font-weight:var(--fw-bold);color:var(--text-inverse)\">Segue as nossas redes sociais<\u002Fdiv>\n<div style=\"display:flex;gap:12px\">\n<a href=\"https://www.instagram.com/racreditosportugal/\" target=\"_blank\" rel=\"noopener\" aria-label=\"Instagram\" style=\"width:48px;height:48px;border-radius:50%;border:1px solid var(--accent-gold);color:var(--accent-gold);display:flex;align-items:center;justify-content:center\" style-hover=\"background:var(--accent-gold);color:var(--maroon-700)\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"5\"><\u002Frect><circle cx=\"12\" cy=\"12\" r=\"4\"><\u002Fcircle><circle cx=\"17.5\" cy=\"6.5\" r=\"1\" fill=\"currentColor\" stroke=\"none\"><\u002Fcircle><\u002Fsvg><\u002Fa>\n<a href=\"https://www.facebook.com/profile.php?id=61577936496401\" target=\"_blank\" rel=\"noopener\" aria-label=\"Facebook\" style=\"width:48px;height:48px;border-radius:50%;border:1px solid var(--accent-gold);color:var(--accent-gold);display:flex;align-items:center;justify-content:center\" style-hover=\"background:var(--accent-gold);color:var(--maroon-700)\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M13.5 21v-7.5h2.6l.4-3h-3V8.6c0-.9.3-1.5 1.5-1.5h1.6V4.4c-.3 0-1.2-.1-2.3-.1-2.3 0-3.9 1.4-3.9 4v2.2H7.8v3h2.6V21h3.1z\"><\u002Fpath><\u002Fsvg><\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"text-align:center;padding:0 24px 24px\">\n<button sc-camel-on-click=\"{{ resetForm }}\" style=\"background:none;border:none;color:var(--text-inverse-muted);font-family:inherit;font-size:13px;text-decoration:underline;cursor:pointer\">Enviar outro pedido<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ showForm }}\" hint-placeholder-val=\"{{ true }}\">\n<form sc-camel-on-submit=\"{{ submit }}\" style=\"background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:clamp(22px,4vw,36px);display:flex;flex-direction:column;gap:18px;box-shadow:var(--shadow-sm)\">\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<div style=\"font-size:13px;font-weight:var(--fw-bold);color:var(--accent-maroon)\">Tenho interesse em<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<sc-for list=\"{{ interests }}\" as=\"opt\" hint-placeholder-count=\"3\">\n<button type=\"button\" sc-camel-on-click=\"{{ opt.onPick }}\" style=\"{{ opt.style }}\"><span style=\"{{ opt.dotStyle }}\"><\u002Fspan>{{ opt.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px\">\n<label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:var(--fw-bold);color:var(--accent-maroon)\"><span>Nome<span style=\"color:var(--accent-gold)\"> *<\u002Fspan><\u002Fspan><input required=\"{{ true }}\" sc-camel-on-invalid=\"{{ invalidMsg }}\" sc-camel-on-input=\"{{ clearMsg }}\" name=\"nome\" value=\"{{ nome }}\" sc-camel-on-change=\"{{ setNome }}\" autocomplete=\"name\" style=\"font-family:inherit;font-size:16px;padding:13px 14px;border:1px solid var(--border-subtle);border-radius:var(--radius-sm);background:var(--surface-page);color:var(--text-primary);outline-color:var(--accent-gold)\"><\u002Flabel>\n<label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:var(--fw-bold);color:var(--accent-maroon)\"><span>Telefone<span style=\"color:var(--accent-gold)\"> *<\u002Fspan><\u002Fspan><input required=\"{{ true }}\" sc-camel-on-invalid=\"{{ invalidMsg }}\" sc-camel-on-input=\"{{ clearMsg }}\" type=\"tel\" name=\"telefone\" value=\"{{ telefone }}\" sc-camel-on-change=\"{{ setTelefone }}\" autocomplete=\"tel\" style=\"font-family:inherit;font-size:16px;padding:13px 14px;border:1px solid var(--border-subtle);border-radius:var(--radius-sm);background:var(--surface-page);color:var(--text-primary);outline-color:var(--accent-gold)\"><\u002Flabel>\n<label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:var(--fw-bold);color:var(--accent-maroon)\"><span>Email<span style=\"color:var(--accent-gold)\"> *<\u002Fspan><\u002Fspan><input required=\"{{ true }}\" sc-camel-on-invalid=\"{{ invalidMsg }}\" sc-camel-on-input=\"{{ clearMsg }}\" type=\"email\" name=\"email\" value=\"{{ email }}\" sc-camel-on-change=\"{{ setEmail }}\" autocomplete=\"email\" style=\"font-family:inherit;font-size:16px;padding:13px 14px;border:1px solid var(--border-subtle);border-radius:var(--radius-sm);background:var(--surface-page);color:var(--text-primary);outline-color:var(--accent-gold)\"><\u002Flabel>\n<label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:var(--fw-bold);color:var(--accent-maroon)\"><span>Localidade <span style=\"font-weight:var(--fw-light);color:var(--text-secondary)\">(opcional)<\u002Fspan><\u002Fspan><input name=\"localidade\" value=\"{{ localidade }}\" sc-camel-on-change=\"{{ setLocalidade }}\" autocomplete=\"address-level2\" style=\"font-family:inherit;font-size:16px;padding:13px 14px;border:1px solid var(--border-subtle);border-radius:var(--radius-sm);background:var(--surface-page);color:var(--text-primary);outline-color:var(--accent-gold)\"><\u002Flabel>\n<\u002Fdiv>\n<label style=\"display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.5;color:var(--text-secondary);font-weight:var(--fw-light);cursor:pointer\"><input required=\"{{ true }}\" sc-camel-on-invalid=\"{{ invalidMsg }}\" sc-camel-on-input=\"{{ clearMsg }}\" type=\"checkbox\" checked=\"{{ consent }}\" sc-camel-on-change=\"{{ setConsent }}\" style=\"margin-top:3px;accent-color:var(--accent-maroon);width:16px;height:16px;flex:0 0 16px\">Autorizo a RA Intermediários de Crédito a contactar-me com base nos dados fornecidos.<span style=\"color:var(--accent-gold)\"> *<\u002Fspan><\u002Flabel>\n<button type=\"submit\" style=\"background:var(--accent-gold);color:var(--maroon-500);font-family:inherit;font-weight:var(--fw-black);font-size:16px;padding:16px;border-radius:var(--radius-pill);border:none;cursor:pointer;min-height:52px\" style-hover=\"filter:brightness(1.08)\">{{ submitLabel }}<\u002Fbutton>\n<sc-if value=\"{{ hasError }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:14px;color:var(--accent-maroon);font-weight:var(--fw-bold);text-align:center\">{{ sendError }}<\u002Fdiv><\u002Fsc-if>\n<\u002Fform>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"background:var(--maroon-700);color:var(--text-inverse-muted);text-align:center;padding:28px 24px 96px;font-size:12.5px;line-height:1.6;font-weight:var(--fw-light);border-top:1px solid var(--border-on-dark)\">\n<img src=\"92ba806a-9a34-4ffa-b536-f82a9cc9e042\" style=\"height:48px;width:132px;margin-bottom:12px\" alt=\"RA Intermediários de Crédito\">\n<p style=\"max-width:980px;margin:0 auto;font-size:12px;line-height:1.7;text-align:justify;text-wrap:pretty\">Peculiar Time, Lda, com o registo n.º 0004632, exerce a atividade de intermediário de crédito na categoria de vinculado, mantendo contratos de vinculado, mantendo contratos de vinculação com os seguintes mutuantes: BANCO BPI S.A., BANCO CTT, S.A., CAIXA GERAL DE DEPÓSITOS, S.A., BANKINTER, S.A. – SUCURSAL EM PORTUGAL, ABANCA CORPORACIÓN BANCARIA, S.A., SUCURSAL EM PORTUGAL, BANCO SANTANDER TOTTA, S.A., NOVO BANCO, S.A., UNION DE CRÉDITOS INMOBILIÁRIOS, S.A., ESTABLECIMIENTO FINANCIERO DE CRÉDITO (SOCIEDAD UNIPERSONAL) – SUCURSAL EM PORTUGAL, SICAM – CAIXA CENTRAL E CAIXAS DE CRÉDITO AGRÍCOLA MÚTUO, BNI – BANCO DE NEGÓCIOS INTERNACIONAL (EUROPA), S.A., BBVA, INSTITUIÇÃO FINANCEIRA DE CRÉDITO S.A., NOVO BANCO DOS AÇORES, S.A.UNICRE - INSTITUIÇÃO FINANCEIRA DE CRÉDITO, S.A. COFIDIS. No âmbito da sua atividade, a Peculiar Time, Lda. realiza os seguintes serviços: Apresentação ou proposta de contratos de crédito a consumidores, assistência a consumidores, mediante a realização de atos preparatórios ou de outros trabalhos de gestão pré-contratual relativamente a contratos de crédito que não tenham sido por si apresentados ou propostos, celebração de contratos de crédito com consumidores em nome dos mutuantes, e prestação de serviços de consultoria.<\u002Fp>\n<\u002Ffooter>\n\n<sc-if value=\"{{ showSticky }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:fixed;left:0;right:0;bottom:0;z-index:90;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--maroon-700);border-top:1px solid var(--border-on-dark);display:flex;gap:10px;align-items:center;justify-content:center\">\n<button sc-camel-on-click=\"{{ goForm }}\" style=\"flex:1;max-width:420px;background:var(--accent-gold);color:var(--maroon-500);font-family:inherit;font-weight:var(--fw-black);font-size:15px;padding:14px;border-radius:var(--radius-pill);border:none;cursor:pointer;min-height:48px\">Pedir contacto<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;emailDestino&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;raquel.silva@racreditos.pt&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;emailCopia&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;daniel.gomes@one.pt,marketing@racreditos.pt,rsilva.famalicaoavenida@gmail.com&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;defaultAudience&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;nenhuma&quot;,&quot;parceiro&quot;,&quot;rede&quot;],&quot;default&quot;:&quot;nenhuma&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;stickyCta&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  state = { audience: null, interest: null, scrolled: false, nearForm: false, submitted: false, nome: '', telefone: '', email: '', localidade: '' };\n  formRef = React.createRef();\n  pillars = [\n    { num: '01', title: 'Especialistas', desc: 'Somos especialistas em encontrar soluções de crédito adequadas ao perfil de cada cliente.' },\n    { num: '02', title: 'Vários bancos', desc: 'Negociamos com vários bancos por si.' },\n    { num: '03', title: 'Comparação', desc: 'Comparamos propostas e ajudamos a encontrar a solução de crédito mais adequada.' },\n    { num: '04', title: 'Excelência', desc: 'Na relação com os nossos parceiros e clientes a RA Intermediários de Crédito trabalha com precisão e cumprimento absoluto das normas e com toda atenção' },\n  ];\n  testimonials = [\n    { slotId: 'lp-test-1', src: (window.__resources && window.__resources.lpTest1) || 'assets/lp/lp-test-1.webp', quote: 'Fazer parte da RA Intermediários de Créditos é integrar uma marca jovem e\\ndinâmica, constituída por profissionais altamente qualificados, onde o\\nespírito de entreajuda, cooperação e partilha de conhecimento faz\\nverdadeiramente a diferença.', name: 'Liliana Costa', role: 'Diretora RA Intermediários de Crédito Póvoa de Varzim' },\n    { slotId: 'lp-test-2', src: (window.__resources && window.__resources.lpTest2) || 'assets/lp/lp-test-2.webp', quote: 'Fazer parte da RA Intermediários de Crédito tem sido um percurso de\\ncrescimento, aprendizagem e conquistas. Destaco a liderança inspiradora\\nda Raquel Silva, cuja visão e determinação impulsionam toda a estrutura.\\nOrgulho-me do caminho\\nque temos construído, dos resultados alcançados e do reconhecimento\\nconquistado. É gratificante contribuir para o crescimento de um projeto no\\nqual acredito plenamente.', name: 'Telma Lopes', role: 'Diretora RA Intermediários de Crédito Vila das Aves' },\n    { slotId: 'lp-test-3', src: (window.__resources && window.__resources.lpTest3) || 'assets/lp/lp-test-3.webp', quote: 'Nos Açores, sabemos bem o que significa trabalhar com a distância. Com a RA Intermediários de Crédito, o oceano que nos separa tornou-se um elo de ligação, através de uma parceria assente na confiança, proximidade e colaboração.\\n\\nValorizamos o profissionalismo, a disponibilidade e o acompanhamento constante da equipa, que nos permitem crescer e encontrar as melhores soluções para cada cliente.\\n\\nPorque a verdadeira proximidade não se mede em quilómetros, mas nas relações que construímos todos os dias.', name: 'Vitor Fraga', role: 'Parceiro RA Intermediários de Crédito' },\n  ];\n  interestOpts = [\n    { id: 'parceiro', label: 'Ser Parceiro de Crédito' },\n    { id: 'agencia', label: 'Abrir uma Agência RA / Office' },\n    { id: 'gestor', label: 'Ser um Gestor de Crédito / Associate' },\n  ];\n  componentDidMount() {\n    const d = this.props.defaultAudience;\n    if (d === 'parceiro' || d === 'rede') this.setState({ audience: d, interest: d === 'parceiro' ? 'parceiro' : 'agencia' });\n    this.check = () => {\n      const el = this.formRef.current;\n      const r = el ? el.getBoundingClientRect() : null;\n      this.setState({ scrolled: window.scrollY > 40, nearForm: !!r && r.top < window.innerHeight && r.bottom > 0, isMobile: window.innerWidth < 760, pastHero: window.scrollY > window.innerHeight * 0.6 });\n    };\n    this.check();\n    window.addEventListener('scroll', this.check, { passive: true });\n    window.addEventListener('resize', this.check);\n  }\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this.check);\n    window.removeEventListener('resize', this.check);\n  }\n  goForm = () => {\n    const el = this.formRef.current;\n    if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 80, behavior: 'smooth' });\n  };\n  pick(aud) {\n    this.setState(s => ({ audience: aud, interest: aud === 'parceiro' ? 'parceiro' : (s.interest && s.interest !== 'parceiro' ? s.interest : 'agencia') }));\n    setTimeout(this.goForm, 60);\n  }\n  card(active) {\n    return `display:flex;flex-direction:column;gap:10px;padding:24px;border-radius:var(--radius-lg);cursor:pointer;font-family:inherit;color:var(--text-inverse);text-align:left;transition:background .2s,border-color .2s;border:${active ? '2px solid var(--accent-gold)' : '1px solid rgba(251,247,239,0.35)'};background:${active ? 'rgba(171,145,80,0.22)' : 'rgba(42,21,22,0.55)'};backdrop-filter:blur(4px)`;\n  }\n  renderVals() {\n    const s = this.state;\n    const sticky = (this.props.stickyCta ?? true) && s.isMobile && s.pastHero && !s.nearForm;\n    return {\n      headerStyle: `position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px clamp(20px,5vw,64px);transition:background .25s,box-shadow .25s;background:${s.scrolled ? 'var(--maroon-700)' : 'transparent'};box-shadow:${s.scrolled ? '0 4px 20px rgba(0,0,0,0.18)' : 'none'}`,\n      partnerCardStyle: this.card(s.audience === 'parceiro'),\n      networkCardStyle: this.card(s.audience === 'rede'),\n      pickPartner: () => this.pick('parceiro'),\n      pickNetwork: () => this.pick('rede'),\n      goForm: this.goForm,\n      formRef: this.formRef,\n      pillars: this.pillars,\n      testimonials: this.testimonials,\n      interests: this.interestOpts.map(o => {\n        const on = s.interest === o.id;\n        return {\n          label: o.label,\n          onPick: () => this.setState({ interest: o.id, audience: o.id === 'parceiro' ? 'parceiro' : 'rede' }),\n          style: `display:flex;align-items:center;gap:12px;width:100%;text-align:left;font-family:inherit;font-size:15px;font-weight:${on ? 'var(--fw-bold)' : 'var(--fw-regular)'};padding:14px 16px;min-height:48px;border-radius:var(--radius-sm);cursor:pointer;color:var(--text-primary);background:${on ? 'var(--cream-300)' : 'var(--surface-page)'};border:${on ? '2px solid var(--accent-maroon)' : '1px solid var(--border-subtle)'}`,\n          dotStyle: `width:16px;height:16px;flex:0 0 16px;border-radius:50%;box-sizing:border-box;border:${on ? '5px solid var(--accent-maroon)' : '2px solid var(--border-subtle)'};background:var(--white)`,\n        };\n      }),\n      nome: s.nome, telefone: s.telefone, email: s.email, localidade: s.localidade,\n      setNome: e => this.setState({ nome: e.target.value }),\n      setTelefone: e => this.setState({ telefone: e.target.value }),\n      setEmail: e => this.setState({ email: e.target.value }),\n      setLocalidade: e => this.setState({ localidade: e.target.value }),\n      invalidMsg: e => { const t = e.target; t.setCustomValidity(''); if (t.validity.valueMissing) t.setCustomValidity(t.type === 'checkbox' ? 'Para enviar o pedido, autorize o contacto.' : 'Preencha este campo obrigatório.'); else if (t.validity.typeMismatch) t.setCustomValidity('Introduza um email válido (ex.: nome@email.pt).'); },\n      clearMsg: e => e.target.setCustomValidity(''),\n      consent: !!s.consent,\n      setConsent: e => this.setState({ consent: e.target.checked, sendError: null }),\n      submit: e => {\n        e.preventDefault();\n        if (s.sending) return;\n        const to = (this.props.emailDestino || 'raquel.silva@racreditos.pt').trim();\n        const cc = (this.props.emailCopia ?? 'daniel.gomes@one.pt,marketing@racreditos.pt,rsilva.famalicaoavenida@gmail.com').replace(/\\s/g, '');\n        const label = (this.interestOpts.find(o => o.id === (s.interest || 'parceiro')) || {}).label;\n        if (!to) { this.setState({ sendError: 'Falta configurar o email de destino.' }); return; }\n        if (!s.nome.trim() || !s.telefone.trim() || !/^\\S+@\\S+\\.\\S+$/.test(s.email.trim())) { this.setState({ sendError: 'Preencha o nome, o telefone e um email válido.' }); return; }\n        if (!s.consent) { this.setState({ sendError: 'Para enviar, autorize o contacto da RA Intermediários de Crédito.' }); return; }\n        this.setState({ sending: true, sendError: null });\n        fetch('https://formsubmit.co/ajax/' + encodeURIComponent(to), {\n          method: 'POST',\n          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },\n          body: JSON.stringify({ _subject: 'Novo contacto Landing Page — ' + label, _template: 'table', _captcha: 'false', ...(cc ? { _cc: cc } : {}), Interesse: label, Nome: s.nome, Telefone: s.telefone, Email: s.email, Localidade: s.localidade })\n        }).then(r => r.json()).then(j => {\n          if (j && (j.success === true || j.success === 'true')) { this.setState({ submitted: true, sending: false }); setTimeout(this.goForm, 50); }\n          else {\n            const msg = (j && j.message) || '';\n            console.warn('FormSubmit:', msg);\n            const act = /activat/i.test(msg);\n            const srv = /web server|file/i.test(msg);\n            this.setState({ sending: false, sendError: act ? 'Formulário a aguardar ativação: confirme o link enviado para ' + to + ' e volte a enviar.' : srv ? 'O formulário só envia quando a página está publicada num site (não funciona em pré-visualização).' : 'Não foi possível enviar. ' + (msg || 'Tente novamente.') });\n          }\n        }).catch(() => this.setState({ sending: false, sendError: 'Não foi possível enviar. Verifique a ligação e tente novamente.' }));\n      },\n      submitLabel: s.sending ? 'A enviar…' : 'Quero ser contactado',\n      sendError: s.sendError || '',\n      hasError: !!s.sendError,\n      resetForm: () => this.setState({ submitted: false, consent: false, nome: '', telefone: '', email: '', localidade: '' }),\n      previewWelcome: () => this.setState({ submitted: true, nome: s.nome || 'Ana' }),\n      submitted: s.submitted,\n      welcomeTag: s.interest === 'parceiro' ? 'Parceiro de Crédito' : s.interest === 'gestor' ? 'Gestor de Crédito' : 'Rede RA',\n      nextSteps: (s.interest === 'parceiro'\n        ? ['Contacto da nossa equipa', 'Reunião de apresentação', 'Acordo de parceria']\n        : ['Contacto da nossa equipa', 'Apresentação do modelo RA', 'Visita a uma agência']).map((label, i) => ({ n: i + 1, label })),\n      showForm: !s.submitted,\n      firstName: (s.nome || '').trim().split(' ')[0],\n      showSticky: sticky,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
